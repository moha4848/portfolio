<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting…</title>
  </head>
  <body>
    <p>Redirecting to the portfolio…</p>
    <script>
      (function () {
        var basePath = '/portfolio';
        var path = window.location.pathname;
        if (path.indexOf(basePath + '/') === 0) {
          path = path.slice(basePath.length);
        }
        var route = path.split('/').filter(Boolean)[0];
        var supportedRoutes = ['about', 'skills', 'projects', 'experience', 'contact', 'dashboard'];
        if (supportedRoutes.indexOf(route) !== -1) {
          window.location.replace(
            basePath + '/?__gh_pages_path=' +
            encodeURIComponent(path + window.location.search + window.location.hash)
          );
        }
      })();
    </script>
  </body>
</html>
